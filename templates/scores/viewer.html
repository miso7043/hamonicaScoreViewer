{% load interface %}{% load static %}<div class="viewer" id="score-viewer" data-layout="{% if mobile %}mobile{% else %}encoded{% endif %}" data-sound-base="{% static 'note_snd/' %}" {% if xml_url %}data-xml-url="{{ xml_url }}"{% endif %} {% if editor_id %}data-editor-id="{{ editor_id }}"{% endif %}>
<div class="playback-toolbar"><div class="playback-controls"><button class="play-button" type="button" data-player-action="play">{% tr "▶ 재생" %}</button><button type="button" data-player-action="stop">{% tr "■ 처음으로" %}</button></div><figure class="harmonica" aria-label="{% tr "C조 24홀 복음 하모니카 운지 안내" %}"><div class="harmonica-diagram"><img src="{% static 'scores/images/tremolo-harmonica.svg' %}?v=2" width="980" height="232" alt="{% tr "24홀 복음 하모니카" %}"><svg data-harmonica-overlay viewBox="0 0 980 275" aria-hidden="true"></svg></div></figure><span data-player-status>{% tr "재생 준비" %}</span></div>
<div class="viewer-toolbar"><div class="control-group"><button type="button" data-action="previous" aria-label="{% tr "이전 페이지" %}" hidden>←</button><span><b data-page-current>1</b> / <span data-page-total>1</span></span><button type="button" data-action="next" aria-label="{% tr "다음 페이지" %}" hidden>→</button></div></div>
<p class="viewer-status" data-status>{% tr "악보 렌더러를 불러오는 중입니다…" %}</p><div class="notation" data-notation tabindex="0" role="region" aria-label="{% tr "악보 (스크롤하여 전체 보기)" %}"></div></div>
