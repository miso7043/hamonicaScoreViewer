# Included inside the existing HTTPS server block.
location = /harmonica { return 302 /harmonica/; }
location ^~ /harmonica/static/ {
    alias /opt/hamonica-player/staticfiles/;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /harmonica/ {
    client_max_body_size 12m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://127.0.0.1:8030/;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.verovio.org 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data: https://www.verovio.org; connect-src 'self' https://www.verovio.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
# Reuse the already registered redirect URI, routing only our state prefix.
location = /auth/google/callback {
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://$hamonica_callback_backend;
}
